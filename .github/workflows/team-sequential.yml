name: OMBRE - Vérification des tours en équipe
on:
  push:
    branches: [main]
    paths:
      - "src/team*.js"
      - "src/engine.js"
      - "src/build-damage.js"
      - "src/weapons.js"
      - "src/classes.js"
      - "src/ecaflip-spells.js"
      - "src/ecaflip-cards.js"
      - "src/character-stats.js"
      - "src/spell-effects-audit.js"
      - "test/profiles.test.mjs"
      - "test/spell-effects-audit.test.mjs"
      - "test/team-ecaflip-karuta.test.mjs"
      - "test/ecaflip-critical-turquoise.test.mjs"
      - "test/ecaflip-four-club-combo.test.mjs"
      - "src/critical.js"
      - "test/team-weapon-mantache.test.mjs"
      - "test/team-choice-audit.test.mjs"
      - "test/team-sequential.test.mjs"
      - "test/team-one-turn-pa.test.mjs"
      - "test/team-stepwise.test.mjs"
      - "test/team-ui.test.mjs"
      - "test/team-manual.test.mjs"
      - "test/team-long-plan.test.mjs"
      - "src/team-long-plan.js"
      - "src/sacrier-safety.js"
      - "src/sacrier-dps-rotation.js"
      - "src/sram-audited-plan.js"
      - "src/team-combat-log.js"
      - "test/team-combat-log.test.mjs"
      - "test/sram-audited-plan.test.mjs"
      - "src/karuta-fifteen-plan.js"
      - "test/karuta-fifteen-plan.test.mjs"
      - "test/sacrier-audited-optimizer.test.mjs"
      - "test/sacrier-safety.test.mjs"
      - "src/team-worker.js"
      - "src/team-ui.js"
      - "src/team-manual.js"
      - "test/team-dps-board.test.mjs"
      - "test/team-sram-buffs.test.mjs"
      - "test/team-audited-ten-plan.test.mjs"
      - "test/team-pacte-manigance-regression.test.mjs"
      - "test/team-100-rounds-regression.test.mjs"
      - "index.html"
      - "team.css"
      - ".github/workflows/team-sequential.yml"
  workflow_dispatch:
jobs:
  team-sequential:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Simulations chronologiques et mémoire des états
        run: node --test
