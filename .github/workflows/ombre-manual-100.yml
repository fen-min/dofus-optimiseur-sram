name: OMBRE - Recherche DPS manuelle 100 tours
on:
  push:
    branches: [main]
    paths:
      - "scripts/ombre-manual-100-search.mjs"
      - "scripts/ombre-manual-100-optimizer.mjs"
      - ".github/workflows/ombre-manual-100.yml"
  workflow_dispatch:
jobs:
  team-100-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Benchmark 100 tours auto et replay MANUEL complet
        run: node scripts/ombre-manual-100-search.mjs
      - name: Deuxième recherche MANUELLE sur 100 tours, depuis le meilleur plan
        env:
          OMBRE100_SEED: optimized
          OMBRE100_FROM: "1"
          OMBRE100_PASSES: "4"
          OMBRE100_BUDGET: "15000"
        run: node scripts/ombre-manual-100-optimizer.mjs
