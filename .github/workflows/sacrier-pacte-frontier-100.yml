name: OMBRE - Pacte de Sang recherche approfondie 100 tours
on:
  push:
    branches: [main]
    paths:
      - "scripts/sacrier-pacte-frontier-100.mjs"
      - ".github/workflows/sacrier-pacte-frontier-100.yml"
  workflow_dispatch:
jobs:
  frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rechercher meilleures séquences Pacte sur 15 puis 100 tours
        run: node scripts/sacrier-pacte-frontier-100.mjs
