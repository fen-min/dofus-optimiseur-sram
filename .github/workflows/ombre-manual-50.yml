name: OMBRE - Recherche DPS manuel 50 tours
on:
  push:
    branches: [main]
    paths:
      - "scripts/ombre-manual-50-search.mjs"
      - "scripts/manual50-user-baseline.json"
      - ".github/workflows/ombre-manual-50.yml"
  workflow_dispatch:
jobs:
  search-manual-50:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rejouer les 49 tours reels puis optimiser 50 tours
        run: node scripts/ombre-manual-50-search.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-ombre-manuel-50
          path: results/ombre-manual-50.json
          retention-days: 14
          if-no-files-found: warn
