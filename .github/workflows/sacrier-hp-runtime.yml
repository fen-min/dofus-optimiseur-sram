name: OMBRE - Validation rotations Sacrieur selon PV
on:
  push:
    branches: [main]
    paths:
      - "src/sacrier-hp-rotation.js"
      - "src/team-sequential.js"
      - "src/team-core.js"
      - "test/sacrier-hp-rotation.test.mjs"
      - "test/sacrier-health-damage.test.mjs"
      - "test/team-ui.test.mjs"
      - ".github/workflows/sacrier-hp-runtime.yml"
  workflow_dispatch:
jobs:
  sacrier-hp:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérifier rotations validées, PV de départ et interface
        run: node --test test/sacrier-hp-rotation.test.mjs test/sacrier-health-damage.test.mjs test/team-ui.test.mjs
