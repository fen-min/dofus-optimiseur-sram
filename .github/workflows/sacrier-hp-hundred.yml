name: OMBRE - Sacrieur PV et DPS 100 tours
on:
  push:
    branches: [main]
    paths:
      - "scripts/sacrier-hp-hundred.mjs"
      - ".github/workflows/sacrier-hp-hundred.yml"
  workflow_dispatch:
jobs:
  dps-100:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comparer ouvertures Sacrieur 100 tours (PV 40 60 70 80)
        run: node scripts/sacrier-hp-hundred.mjs
